name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, for example 0.1.0 or 0.2.0-preview.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: '[[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dotnet-cockpit-*
          path: artifacts/release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: dotnet-tool
          path: artifacts/release
      - name: Validate NuGet publisher
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "Set NUGET_USER to the NuGet.org profile name in repository Actions secrets." >&2
            exit 1
          fi
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish .NET tool package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/release/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          (cd artifacts/release && sha256sum *.tar.gz *.zip *.nupkg > SHA256SUMS)
          options=()
          if [[ "$PACKAGE_VERSION" == *-* ]]; then options+=(--prerelease); fi
          gh release create "v$PACKAGE_VERSION" artifacts/release/* --target "$GITHUB_SHA" --title ".NET Cockpit $PACKAGE_VERSION" --generate-notes "${options[@]}"
