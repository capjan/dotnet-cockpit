name: Build and test

on:
  push:
    paths-ignore:
      - docs/**
  pull_request:
    paths-ignore:
      - docs/**
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.3.0'

permissions:
  contents: read

jobs:
  native:
    name: Native AOT (${{ matrix.rid }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build browser assets
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
      - name: Unit tests
        run: dotnet test DotnetCockpit.sln --configuration Release
      - name: Restore MDU
        if: matrix.os == 'macos-latest'
        run: dotnet tool restore
      - name: Lint documentation
        if: matrix.os == 'macos-latest'
        run: dotnet mdu lint docs
      - name: Publish Native AOT executable
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.3.0' }}
        run: dotnet publish src/DotnetCockpit/DotnetCockpit.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishAot=true -warnaserror:IL2026,IL2104,IL3050,IL3053 -p:Version="$PACKAGE_VERSION" --output artifacts/native
      - name: Smoke test published executable
        run: node scripts/smoke.mjs artifacts/native/dotnet-cockpit
      - name: Install browser
        working-directory: ui
        run: npx playwright install chromium
      - name: Test UI against native backend
        if: matrix.os == 'macos-latest'
        run: npm --prefix ui run test:browser
      - name: Exercise the real features end to end
        run: npm --prefix ui run test:e2e
      - name: Compare screenshots
        if: matrix.os == 'macos-latest'
        run: npm --prefix ui run test:visual
      - name: Archive native executable
        run: tar -czf "artifacts/dotnet-cockpit-${{ matrix.rid }}.tar.gz" -C artifacts/native dotnet-cockpit
      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-cockpit-${{ matrix.rid }}
          path: artifacts/dotnet-cockpit-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-${{ matrix.rid }}
          path: ui/test-results/
          if-no-files-found: ignore

  tool:
    name: .NET tool package
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build browser assets
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
      - name: Pack .NET tool
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.3.0' }}
        run: dotnet pack src/DotnetCockpit/DotnetCockpit.csproj --configuration Release -p:Version="$PACKAGE_VERSION" --output artifacts/packages
      - name: Install and smoke test tool package
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.3.0' }}
        run: |
          dotnet tool install dotnet-cockpit --tool-path "$PWD/artifacts/tool" --add-source "$PWD/artifacts/packages" --version "$PACKAGE_VERSION"
          PATH="$PWD/artifacts/tool:$PATH" dotnet cockpit --help
          node scripts/smoke.mjs artifacts/tool/dotnet-cockpit --tool
      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-tool
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
